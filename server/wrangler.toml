name = "vex-online"
main = "src/index.ts"
compatibility_date = "2026-06-01"

[vars]
# Players sign in with their Minecraft account (verified with Mojang) — nothing to register.
# Optional, older sign-in with Modrinth: set a Modrinth app's Client ID here and the secret with
#   npx wrangler secret put MODRINTH_CLIENT_SECRET
MODRINTH_CLIENT_ID = "REPLACE_WITH_CLIENT_ID"

[[d1_databases]]
binding = "DB"
database_name = "vex-online"
database_id = "REPLACE_WITH_DATABASE_ID"
migrations_dir = "migrations"
