<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VEX">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/app/icon-192.png">
<link rel="apple-touch-icon" href="/app/icon-192.png">
<title>VEX</title>
<style>
:root {
  --accent: #ff6fb5; --accent-ink: #2a0618; --ink: #0c0c0f; --deep: #111115; --surface: #17171c; --raised: #202027;
  --line: rgb(255 255 255 / .08); --line2: rgb(255 255 255 / .15); --text: #f4f1f4; --dim: #a7a7b2; --faint: #6f6f7b;
  --ok: #5fe3a1; --warn: #ffc46b; --bad: #ff5c7a;
  --bevel: inset 2px 2px 0 rgb(0 0 0 / .45), inset -2px -2px 0 rgb(255 255 255 / .07);
  --spring: cubic-bezier(.34, 1.56, .64, 1); --ease: cubic-bezier(.2, .8, .2, 1);
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); font: 500 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; letter-spacing: -0.02em; font-weight: 800; }
p { margin: 0; }
.app { min-height: 100%; display: flex; flex-direction: column; }
header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: calc(12px + var(--safe-t)) 16px 12px;
  background: color-mix(in oklab, var(--ink) 88%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
header h1 { font-size: 20px; flex: 1; }
.logo { width: 26px; height: 26px; flex: none; }
main { flex: 1; padding: 16px 16px calc(96px + var(--safe-b)); max-width: 720px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
main > * { animation: rise 420ms var(--ease) both; }
main > *:nth-child(2) { animation-delay: 50ms; } main > *:nth-child(3) { animation-delay: 100ms; } main > *:nth-child(n+4) { animation-delay: 150ms; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; padding: 8px 8px calc(8px + var(--safe-b)); gap: 4px;
  background: color-mix(in oklab, var(--deep) 92%, transparent); backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
nav.tabs button { flex: 1; border: 0; background: none; padding: 6px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--faint); font-size: 11.5px; font-weight: 650; border-radius: 10px; position: relative; }
nav.tabs button svg { width: 22px; height: 22px; transition: transform 300ms var(--spring); }
nav.tabs button[aria-current="page"] { color: var(--text); }
nav.tabs button[aria-current="page"] svg { color: var(--accent); transform: translateY(-2px) scale(1.08); }
nav.tabs button[aria-current="page"]::after { content: ""; position: absolute; top: -9px; width: 22px; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); animation: pop 300ms var(--spring); }
nav.tabs .badge { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 10px; display: grid; place-items: center; }
@keyframes pop { from { transform: scaleX(0); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; position: relative; overflow: hidden; }
.section-title { display: flex; align-items: center; gap: 10px; font-size: 17px; margin-bottom: 10px; }
.section-title::before { content: ""; width: 8px; height: 8px; background: var(--accent); box-shadow: 3px 3px 0 color-mix(in oklab, var(--accent) 40%, transparent); }
.muted { color: var(--dim); } .faint { color: var(--faint); } .small { font-size: 13px; } .tiny { font-size: 12px; }
.row { display: flex; align-items: center; gap: 10px; } .stack { display: flex; flex-direction: column; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line2); background: var(--raised); font-weight: 700; cursor: pointer;
  transition: transform 160ms var(--spring), filter 160ms; }
.btn:active { transform: scale(.96); }
.btn.primary { border: 0; background: var(--accent); color: var(--accent-ink); box-shadow: inset 0 -3px 0 rgb(0 0 0 / .22); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--dim); }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn.danger { color: #ffb3bf; border-color: color-mix(in oklab, var(--bad) 40%, transparent); }
.btn:disabled { opacity: .45; }
.input, textarea, select { width: 100%; height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--ink); outline: none; }
textarea { height: 96px; padding: 10px 12px; resize: vertical; }
.input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 25%, transparent); }
.face { width: 40px; height: 40px; flex: none; border-radius: 6px; box-shadow: var(--bevel); background: #26262d; image-rendering: pixelated; position: relative; overflow: hidden; display: grid; place-items: center; font-weight: 800; color: var(--accent); }
.face i { position: absolute; inset: 0; background-size: 800% 800%; image-rendering: pixelated; }
.face .skin { background-position: 14.2857% 14.2857%; } .face .hat { background-position: 71.4286% 14.2857%; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.on { background: var(--ok); animation: pulse 2.4s ease-in-out infinite; } .dot.play { background: var(--accent); }
@keyframes pulse { 50% { opacity: .5; } }
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.item b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .grow { flex: 1; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 5px; font-size: 11.5px; font-weight: 700; border: 1px solid var(--line2); color: var(--dim); }
.chip.ok { color: var(--ok); border-color: color-mix(in oklab, var(--ok) 40%, transparent); } .chip.warn { color: var(--warn); border-color: color-mix(in oklab, var(--warn) 40%, transparent); }
.empty { text-align: center; padding: 28px 16px; color: var(--faint); border: 1px dashed var(--line2); border-radius: 12px; }
.seg { display: flex; gap: 3px; padding: 3px; background: var(--ink); border: 1px solid var(--line); border-radius: 9px; }
.seg button { flex: 1; height: 34px; border: 0; background: none; border-radius: 6px; font-weight: 650; color: var(--dim); }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--line2); }
.news { border-left: 3px solid var(--line2); }
.news.update { border-left-color: var(--accent); } .news.warning { border-left-color: var(--warn); }
.hero { padding: 22px 18px; isolation: isolate; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(100deg, var(--surface) 35%, transparent),
  conic-gradient(from 200deg at 90% 120%, color-mix(in oklab, var(--accent) 45%, transparent), #b77dff66, color-mix(in oklab, var(--accent) 45%, transparent)); animation: glow 9s ease-in-out infinite alternate; }
.hero::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 60%; z-index: -1; opacity: .45;
  background-image: linear-gradient(rgb(255 255 255 / .09) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / .09) 1px, transparent 1px); background-size: 18px 18px;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 60%); mask-image: linear-gradient(90deg, transparent, #000 60%); animation: drift 14s linear infinite; }
@keyframes glow { to { filter: hue-rotate(16deg) saturate(1.2); } } @keyframes drift { to { background-position: 18px 18px, 18px 18px; } }
.hero h2 { font-size: 28px; line-height: 1.05; margin-top: 4px; }
.hello { color: var(--accent); font-weight: 650; font-size: 14px; }
.stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.stat b { display: block; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(86px + var(--safe-b)); z-index: 50; padding: 12px 14px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line2);
  box-shadow: 0 18px 40px -16px #000; animation: toastIn 360ms var(--spring); font-weight: 600; }
.toast.bad { border-color: color-mix(in oklab, var(--bad) 55%, transparent); }
@keyframes toastIn { from { opacity: 0; transform: translateY(16px) scale(.96); } }
.pair { min-height: 100%; display: grid; place-items: center; padding: 24px; }
.pair-card { width: min(420px, 100%); display: flex; flex-direction: column; gap: 14px; text-align: center; align-items: center; }
.pair-card .logo { width: 64px; height: 64px; animation: float 5s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-8px); } }
.code-input { text-align: center; font: 800 26px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .3em; text-transform: uppercase; height: 60px; }
.steps { text-align: left; color: var(--dim); font-size: 14px; display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; width: 100%; }
.steps b { color: var(--text); }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgb(255 255 255 / .2); border-top-color: var(--accent); animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.sheet-back { position: fixed; inset: 0; z-index: 60; background: rgb(0 0 0 / .55); display: flex; align-items: flex-end; animation: fade 200ms; }
.sheet { width: 100%; max-height: 85vh; overflow: auto; background: var(--deep); border-top: 1px solid var(--line2); border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + var(--safe-b)); animation: up 380ms var(--spring); }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line2); margin: -6px auto 14px; }
@keyframes fade { from { opacity: 0; } } @keyframes up { from { transform: translateY(40%); opacity: .4; } }
label.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 650; color: var(--dim); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
const API = location.origin;
const LOGO = '<svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><path d="M8 10h14l10 30 10-30h14L38 56H26z" fill="#8f8f96"/><path d="M22 10l10 30 10-30" fill="none" stroke="var(--accent)" stroke-width="3" opacity=".9"/></svg>';
const I = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>',
  friends: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 5.5 5.3"/></svg>',
  collab: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>',
  admin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>',
};
const S = { token: null, me: null, tab: "home", home: null, friends: null, shares: null, search: [], q: "", fseg: "friends", admin: null, aseg: "overview" };
try { S.token = localStorage.getItem("vex.token"); } catch {}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => "&#" + c.charCodeAt(0) + ";");
const ago = (t) => { if (!t) return ""; const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " d ago"; };
const face = (u, size = 40) => {
  const url = u && /^https:\/\/textures\.minecraft\.net\/texture\/[0-9a-f]+$/.test(u.avatar || "") ? u.avatar : null;
  return url ? `<span class="face" style="width:${size}px;height:${size}px"><i class="skin" style="background-image:url('${url}')"></i><i class="hat" style="background-image:url('${url}')"></i></span>`
    : `<span class="face" style="width:${size}px;height:${size}px">${esc((u?.username || "?")[0].toUpperCase())}</span>`;
};
let toastTimer;
function toast(msg, bad) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div"); t.className = "toast" + (bad ? " bad" : ""); t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3200);
}
async function api(method, path, body) {
  const r = await fetch(API + path, { method, headers: { "content-type": "application/json", ...(S.token ? { authorization: "Bearer " + S.token } : {}) }, body: body === undefined ? undefined : JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && path.startsWith("/v1/")) { signOut(true); throw new Error("Signed out. Connect your phone again."); }
  if (!r.ok) throw new Error(data.error || "VEX online answered " + r.status);
  return data;
}
function signOut(silent) {
  if (!silent && S.token) api("POST", "/v1/logout").catch(() => {});
  S.token = null; S.me = null; try { localStorage.removeItem("vex.token"); } catch {}
  render();
}

// ---------- pairing ----------
async function pair(code) {
  code = String(code || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (code.length !== 8) return toast("The code has 8 letters and numbers.", true);
  const btn = document.getElementById("pairBtn"); if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Connecting'; }
  try {
    const r = await api("POST", "/auth/pair", { code });
    S.token = r.token; try { localStorage.setItem("vex.token", r.token); } catch {}
    history.replaceState(null, "", location.pathname);
    await boot();
    toast("Connected as " + (S.me?.username || "you"));
  } catch (e) { toast(e.message, true); if (btn) { btn.disabled = false; btn.textContent = "Connect"; } }
}
function renderPair() {
  return `<div class="pair"><div class="pair-card">
    ${LOGO.replace('class="logo"', 'class="logo"')}
    <h1 style="font-size:28px">VEX on your phone</h1>
    <p class="muted">Friends, news, Collab and admin, wherever you are.</p>
    <input id="code" class="input code-input" maxlength="9" autocomplete="one-time-code" placeholder="ABCD1234" value="${esc(new URLSearchParams(location.hash.slice(1)).get("code") || "")}">
    <button id="pairBtn" class="btn primary" style="width:100%;height:48px" onclick="pair(document.getElementById('code').value)">Connect</button>
    <div class="steps"><span>1. Open <b>VEX CLIENT</b> on your PC.</span><span>2. Go to <b>Settings → Phone app</b> and click <b>Connect a phone</b>.</span><span>3. Scan the QR code, or type the code here.</span></div>
    <p class="tiny faint">Tip: in your browser menu, choose <b>Add to Home Screen</b> to keep VEX like an app.</p>
  </div></div>`;
}

// ---------- tabs ----------
async function load(tab, force) {
  try {
    if (tab === "home" && (force || !S.home)) S.home = await api("GET", "/v1/public/home");
    if ((tab === "friends" || tab === "home") && (force || !S.friends)) S.friends = await api("GET", "/v1/friends");
    if (tab === "collab" && (force || !S.shares)) S.shares = await api("GET", "/v1/shares");
    if (tab === "admin" && S.me?.admin) {
      if (S.aseg === "overview" && (force || !S.admin?.overview)) S.admin = { ...S.admin, overview: await api("GET", "/v1/admin/overview") };
      if (S.aseg === "bugs" && (force || !S.admin?.bugs)) S.admin = { ...S.admin, bugs: await api("GET", "/v1/admin/bugs?status=open") };
      if (S.aseg === "players" && (force || !S.admin?.users)) S.admin = { ...S.admin, users: await api("GET", "/v1/admin/users") };
      if (S.aseg === "news" && (force || !S.home)) S.home = await api("GET", "/v1/public/home");
    }
  } catch (e) { toast(e.message, true); }
  render();
}
function go(tab) { S.tab = tab; window.scrollTo({ top: 0 }); render(); load(tab); }

function homeTab() {
  const h = S.home, f = S.friends;
  const online = (f?.friends || []).filter((x) => x.online);
  const feat = h?.featured;
  return `
  <section class="card hero"><span class="hello">Hey ${esc(S.me?.username)}</span><h2>${online.length ? online.length + (online.length === 1 ? " friend is" : " friends are") + " online" : "VEX online"}</h2>
    <p class="muted small" style="margin-top:6px">${online.length ? online.slice(0, 3).map((x) => esc(x.username)).join(", ") + (online.length > 3 ? " and more" : "") : "Nobody's online right now."}</p></section>
  ${feat ? `<section><h2 class="section-title">Featured server</h2><div class="card"><div class="row"><div style="flex:1;min-width:0"><b>${esc(feat.name)}</b><div class="tiny faint">${esc(feat.address)}${feat.version ? " · " + esc(feat.version) : ""}</div></div>
    <button class="btn sm" onclick="navigator.clipboard?.writeText('${esc(feat.address)}').then(()=>toast('Address copied'))">Copy</button></div>${feat.description ? `<p class="small muted" style="margin-top:8px">${esc(feat.description)}</p>` : ""}</div></section>` : ""}
  <section><h2 class="section-title">News</h2>${!h ? '<div class="empty"><span class="spinner" style="margin:auto"></span></div>' : h.announcements.length ? `<div class="list">${h.announcements.map((a) => `
    <div class="card news ${esc(a.kind)}"><b>${esc(a.title)}</b><p class="small muted" style="margin-top:4px;white-space:pre-wrap">${esc(a.body)}</p><div class="tiny faint" style="margin-top:8px">${esc(a.author)} · ${ago(a.createdAt)}</div></div>`).join("")}</div>` : '<div class="empty">No news yet.</div>'}</section>`;
}

function friendsTab() {
  const f = S.friends;
  const inc = f?.incoming || [];
  const seg = `<div class="seg"><button aria-pressed="${S.fseg === "friends"}" onclick="S.fseg='friends';render()">Friends ${f ? "(" + f.friends.length + ")" : ""}</button><button aria-pressed="${S.fseg === "requests"}" onclick="S.fseg='requests';render()">Requests ${inc.length ? "(" + inc.length + ")" : ""}</button></div>`;
  const search = `<section><input class="input" placeholder="Add friends: search Minecraft names" value="${esc(S.q)}" oninput="searchPlayers(this.value)">
    ${S.search.length ? `<div class="list" style="margin-top:8px">${S.search.map((u) => `<div class="item">${face(u)}<div class="grow"><b>${esc(u.username)}</b></div>${u.relation === "friends" ? '<span class="chip ok">Friends</span>' : u.relation === "outgoing" ? '<span class="chip">Sent</span>' : `<button class="btn sm primary" onclick="addFriend('${esc(u.id)}')">${u.relation === "incoming" ? "Accept" : "Add"}</button>`}</div>`).join("")}</div>` : ""}</section>`;
  let body;
  if (!f) body = '<div class="empty"><span class="spinner" style="margin:auto"></span></div>';
  else if (S.fseg === "friends") body = f.friends.length ? `<div class="list">${f.friends.map((u) => `<div class="item">${face(u)}<div class="grow"><b>${esc(u.username)}</b><span class="tiny faint">${u.online ? esc(u.detail || (u.status === "playing" ? "Playing" : "Online")) : u.lastSeen ? "Seen " + ago(u.lastSeen) : "Offline"}</span></div><span class="dot ${u.online ? (u.status === "playing" ? "play" : "on") : ""}"></span><button class="btn sm ghost" aria-label="Remove" onclick="removeFriend('${esc(u.id)}','${esc(u.username)}')">✕</button></div>`).join("")}</div>` : '<div class="empty">No friends yet. Search above to add some.</div>';
  else body = (inc.length || f.outgoing.length) ? `<div class="list">${inc.map((u) => `<div class="item">${face(u)}<div class="grow"><b>${esc(u.username)}</b><span class="tiny faint">Wants to be friends</span></div><button class="btn sm primary" onclick="addFriend('${esc(u.id)}')">Accept</button><button class="btn sm ghost" onclick="removeFriend('${esc(u.id)}')">Decline</button></div>`).join("")}
    ${f.outgoing.map((u) => `<div class="item">${face(u)}<div class="grow"><b>${esc(u.username)}</b><span class="tiny faint">Request sent</span></div><button class="btn sm ghost" onclick="removeFriend('${esc(u.id)}')">Cancel</button></div>`).join("")}</div>` : '<div class="empty">No requests.</div>';
  return search + seg + body;
}
let searchT;
function searchPlayers(q) {
  S.q = q; clearTimeout(searchT);
  if (q.trim().length < 2) { S.search = []; return render(true); }
  searchT = setTimeout(async () => { try { S.search = await api("GET", "/v1/users/search?q=" + encodeURIComponent(q.trim())); } catch (e) { toast(e.message, true); } render(true); }, 300);
}
async function addFriend(id) { try { const r = await api("POST", "/v1/friends/" + id); toast(r.relation === "friends" ? "You're friends now" : "Request sent"); S.search = S.search.map((u) => u.id === id ? { ...u, relation: r.relation } : u); await load("friends", true); } catch (e) { toast(e.message, true); } }
async function removeFriend(id, name) { if (name && !confirm("Remove " + name + " from your friends?")) return; try { await api("DELETE", "/v1/friends/" + id); await load("friends", true); } catch (e) { toast(e.message, true); } }

function collabTab() {
  const s = S.shares;
  if (!s) return '<div class="empty"><span class="spinner" style="margin:auto"></span></div>';
  const card = (x, incoming) => `<div class="item"><span class="face" style="background:#101014">${esc(x.instance.loader[0].toUpperCase())}</span><div class="grow"><b>${esc(x.instance.name)}</b>
    <span class="tiny faint">Minecraft ${esc(x.instance.version)}${x.instance.loader !== "vanilla" ? ", " + esc(x.instance.loader) : ""} · ${x.instance.mods.length} mods · ${incoming ? "from " + esc(x.from.username) : "to " + esc(x.to.username)} · ${ago(x.createdAt)}</span></div>
    ${incoming ? `<button class="btn sm ghost" onclick="dismissShare(${Number(x.id)})">Dismiss</button>` : ""}</div>`;
  return `<section><h2 class="section-title">Sent to you</h2>${s.incoming.length ? `<div class="list">${s.incoming.map((x) => card(x, true)).join("")}</div><p class="tiny faint" style="margin-top:8px">Open VEX on your PC to add these instances (Collab page).</p>` : '<div class="empty">Nothing yet. Friends can send you their instance from VEX on PC.</div>'}</section>
    <section><h2 class="section-title">You sent</h2>${s.sent.length ? `<div class="list">${s.sent.map((x) => card(x, false)).join("")}</div>` : '<div class="empty">You haven\'t shared an instance yet.</div>'}</section>`;
}
async function dismissShare(id) { try { await api("DELETE", "/v1/shares/" + id); await load("collab", true); } catch (e) { toast(e.message, true); } }

function adminTab() {
  const a = S.admin || {};
  const seg = `<div class="seg">${[["overview", "Overview"], ["news", "News"], ["bugs", "Bugs"], ["players", "Players"]].map(([k, l]) => `<button aria-pressed="${S.aseg === k}" onclick="S.aseg='${k}';render();load('admin')">${l}</button>`).join("")}</div>`;
  let body = '<div class="empty"><span class="spinner" style="margin:auto"></span></div>';
  if (S.aseg === "overview" && a.overview) {
    const o = a.overview;
    body = `<div class="stat"><div><b>${o.users ?? 0}</b><span class="tiny faint">Players</span></div><div><b>${o.online ?? 0}</b><span class="tiny faint">Online</span></div><div><b>${o.openBugs ?? 0}</b><span class="tiny faint">Open bugs</span></div></div>
      <div class="card small muted">Online service ${esc(o.serverVersion)} · admins: ${esc((o.admins || []).join(", "))}</div>`;
  } else if (S.aseg === "news") {
    const h = S.home;
    body = `<div class="card stack"><b>Post an announcement</b>
      <input id="nTitle" class="input" placeholder="Title"><textarea id="nBody" placeholder="What's new?"></textarea>
      <select id="nKind"><option value="news">News</option><option value="update">Update</option><option value="warning">Warning</option></select>
      <button class="btn primary" onclick="postNews()">Post to every VEX player</button></div>
      ${h ? h.announcements.map((x) => `<div class="item"><div class="grow"><b>${esc(x.title)}</b><span class="tiny faint">${ago(x.createdAt)}</span></div><button class="btn sm danger" onclick="deleteNews(${Number(x.id)})">Delete</button></div>`).join("") : ""}
      <div class="card stack"><b>Featured server</b><input id="fName" class="input" placeholder="Name" value="${esc(h?.featured?.name)}"><input id="fAddr" class="input" placeholder="play.example.net" value="${esc(h?.featured?.address)}">
      <input id="fDesc" class="input" placeholder="Short description" value="${esc(h?.featured?.description)}"><div class="row"><button class="btn primary" style="flex:1" onclick="saveFeatured()">Save</button>${h?.featured ? '<button class="btn danger" onclick="clearFeatured()">Remove</button>' : ""}</div></div>`;
  } else if (S.aseg === "bugs" && a.bugs) {
    body = a.bugs.length ? `<div class="list">${a.bugs.map((b) => `<div class="card"><b>${esc(b.title)}</b><p class="small muted" style="margin-top:4px;white-space:pre-wrap">${esc(b.body)}</p>
      <div class="row" style="margin-top:10px"><span class="tiny faint" style="flex:1">${esc(b.by)} · ${esc(b.version || "")} · ${ago(b.createdAt)}</span><button class="btn sm primary" onclick="setBug(${Number(b.id)},'fixed')">Fixed</button><button class="btn sm ghost" onclick="setBug(${Number(b.id)},'wontfix')">Won't fix</button></div></div>`).join("")}</div>` : '<div class="empty">No open bug reports.</div>';
  } else if (S.aseg === "players" && a.users) {
    body = `<div class="list">${a.users.map((u) => `<div class="item">${face(u)}<div class="grow"><b>${esc(u.username)}${u.admin ? ' <span class="chip ok">admin</span>' : ""}</b><span class="tiny faint">${u.online ? "Online" : u.lastSeen ? "Seen " + ago(u.lastSeen) : "Never online"}</span></div>
      ${u.admin ? "" : `<button class="btn sm ${u.banned ? "" : "danger"}" onclick="setBan('${esc(u.id)}',${!u.banned})">${u.banned ? "Unban" : "Ban"}</button>`}</div>`).join("")}</div>`;
  }
  return seg + body;
}
async function postNews() {
  const title = document.getElementById("nTitle").value, body = document.getElementById("nBody").value, kind = document.getElementById("nKind").value;
  try { S.home = await api("POST", "/v1/admin/announcements", { title, body, kind }); toast("Posted"); render(); } catch (e) { toast(e.message, true); }
}
async function deleteNews(id) { if (!confirm("Delete this announcement?")) return; try { S.home = await api("DELETE", "/v1/admin/announcements/" + id); render(); } catch (e) { toast(e.message, true); } }
async function saveFeatured() {
  try { S.home = await api("PUT", "/v1/admin/featured", { name: document.getElementById("fName").value, address: document.getElementById("fAddr").value, description: document.getElementById("fDesc").value }); toast("Featured server saved"); render(); } catch (e) { toast(e.message, true); }
}
async function clearFeatured() { try { S.home = await api("DELETE", "/v1/admin/featured"); render(); } catch (e) { toast(e.message, true); } }
async function setBug(id, status) { try { await api("POST", "/v1/admin/bugs/" + id, { status }); S.admin.bugs = S.admin.bugs.filter((b) => b.id !== id); toast(status === "fixed" ? "Marked fixed" : "Marked won't fix"); render(); } catch (e) { toast(e.message, true); } }
async function setBan(id, banned) { try { await api("POST", "/v1/admin/users/" + id + "/ban", { banned }); S.admin.users = S.admin.users.map((u) => u.id === id ? { ...u, banned } : u); toast(banned ? "Banned" : "Unbanned"); render(); } catch (e) { toast(e.message, true); } }

function profileSheet() {
  const back = document.createElement("div"); back.className = "sheet-back";
  back.innerHTML = `<div class="sheet"><div class="grab"></div><div class="row">${face(S.me, 52)}<div style="flex:1"><h3>${esc(S.me?.username)}</h3><span class="tiny faint">${S.me?.admin ? "VEX admin" : "VEX player"}</span></div></div>
    <p class="small muted" style="margin:14px 0">This phone is connected to VEX online. Disconnecting signs this phone out only.</p>
    <button class="btn danger" style="width:100%" onclick="this.closest('.sheet-back').remove();signOut()">Disconnect this phone</button>
    ${window.VexAndroid ? '<button class="btn ghost" style="width:100%;margin-top:8px" onclick="VexAndroid.changeServer()">Change VEX online server</button>' : ""}</div>`;
  back.addEventListener("click", (e) => { if (e.target === back) back.remove(); });
  document.body.appendChild(back);
}

const TITLES = { home: "Home", friends: "Friends", collab: "Collab", admin: "Admin" };
function render(keepFocus) {
  const root = document.getElementById("root");
  if (!S.token || !S.me) { root.innerHTML = S.token ? '<div class="pair"><span class="spinner"></span></div>' : renderPair(); return; }
  const focused = keepFocus ? document.activeElement : null;
  const sel = focused && "selectionStart" in focused ? focused.selectionStart : null;
  const tabs = ["home", "friends", "collab", ...(S.me.admin ? ["admin"] : [])];
  const inc = S.friends?.incoming?.length || 0;
  const content = S.tab === "home" ? homeTab() : S.tab === "friends" ? friendsTab() : S.tab === "collab" ? collabTab() : adminTab();
  root.innerHTML = `<div class="app">
    <header>${LOGO}<h1>${TITLES[S.tab]}</h1><button class="btn sm ghost" aria-label="Refresh" onclick="load(S.tab,true)">${I.refresh}</button><button style="border:0;background:none;padding:0" aria-label="Profile" onclick="profileSheet()">${face(S.me, 32)}</button></header>
    <main ${keepFocus ? 'style="--x:0"' : ""}>${content}</main>
    <nav class="tabs">${tabs.map((t) => `<button aria-current="${S.tab === t ? "page" : "false"}" onclick="go('${t}')">${I[t]}${TITLES[t]}${t === "friends" && inc ? `<span class="badge">${inc}</span>` : ""}</button>`).join("")}</nav></div>`;
  if (keepFocus) {
    document.querySelectorAll("main > *").forEach((n) => (n.style.animation = "none"));
    const input = document.querySelector("main input.input"); if (input && focused?.tagName === "INPUT") { input.focus(); if (sel !== null) input.setSelectionRange(sel, sel); }
  }
}

async function boot() {
  if (!S.token) return render();
  render();
  try { S.me = await api("GET", "/v1/me"); } catch (e) { if (S.token) toast(e.message, true); return render(); }
  render(); load(S.tab, true);
}
const hashCode = new URLSearchParams(location.hash.slice(1)).get("code");
if (hashCode && !S.token) { render(); setTimeout(() => pair(hashCode), 300); } else boot();
setInterval(() => { if (S.me && document.visibilityState === "visible" && (S.tab === "friends" || S.tab === "home")) load(S.tab, true); }, 45000);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/app/sw.js", { scope: "/app" }).catch(() => {});
</script>
</body>
</html>
