plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = 'net.vexclient'
base { archivesName = 'vex-client-mod' }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// Client game tests: start the real game in CI, open the Vex menus and take screenshots
// (src/gametest). Run with: gradle runClientGameTest (needs a screen; CI uses xvfb).
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'vexclient-gametest'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}
loom.runs.matching { it.name == 'clientGameTest' }.configureEach {
    vmArg '-Dfabric.client.gametest.disableNetworkSynchronizer=true'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    filesMatching('fabric.mod.json') { expand 'version': project.version, 'minecraft_version': project.minecraft_version }
}

java {
    // Gradle/Loom may run on a newer JDK; the mod itself is compiled for Java 21 (what Minecraft 1.21.11 uses).
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
