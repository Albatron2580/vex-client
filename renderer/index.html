<!doctype html>
<html lang="en" data-theme="vex">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data: file:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Vex Client</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="land" aria-hidden="true"></canvas>
<div id="theme-bg" aria-hidden="true" hidden></div>
<div id="app">
  <aside id="side">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4h5l5 11 5-11h5l-8 17h-4z"/></svg>
      <span>Vex Client</span>
    </div>
    <nav id="nav-main" aria-label="Main"></nav>
    <nav id="nav-bottom" aria-label="Account and settings"></nav>
  </aside>
  <div id="shell">
    <header id="top">
      <h1 id="page-title">Home</h1>
      <span class="grow"></span>
      <div id="activity" class="activity" role="status" hidden></div>
      <button id="profile-chip" class="chip-btn" title="Choose or edit profiles"></button>
      <button id="acct-chip" class="chip-btn acct" title="Account"></button>
    </header>
    <main id="pages"></main>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<script src="themes.js"></script>
<script src="core.js"></script>
<script src="fx.js"></script>
<script src="biome.js"></script>
<script src="skin.js"></script>
<script src="home.js"></script>
<script src="importperf.js"></script>
<script src="profiles.js"></script>
<script src="browse.js"></script>
<script src="packs.js"></script>
<script src="cosmetics.js"></script>
<script src="media.js"></script>
<script src="account.js"></script>
<script src="admin.js"></script>
<script src="updates.js"></script>
<script src="settings.js"></script>
<script src="help.js"></script>
<script src="app.js"></script>
</body>
</html>
