# Builds the VEX Android app (the VEX online phone app in a real app) and publishes it on the "android"
# pre-release: vex-android.apk (install directly), vex-android.aab (upload to Google Play) and the store kit.
# Signing for Google Play uses the upload key that VEX's Admin → Phone app sets up as repo secrets.
name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Upload key
        env:
          KS: ${{ secrets.VEX_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.p12"; echo "VEX_KEYSTORE_FILE=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"; echo "Signed with the VEX upload key"; else echo "No upload key yet: test signature only (fine for installing the APK, not for Google Play)"; fi

      - name: Build
        env:
          VEX_KEYSTORE_PASSWORD: ${{ secrets.VEX_KEYSTORE_PASSWORD }}
          VEX_ONLINE_URL: ${{ secrets.VEX_ONLINE_URL }}
        run: |
          set -o pipefail
          export VEX_VERSION_NAME=$(python3 -c "import json;print(json.load(open('launcher/package.json'))['version'])")
          export VEX_VERSION_CODE=$((100 + ${{ github.run_number }}))
          echo "VEX app $VEX_VERSION_NAME ($VEX_VERSION_CODE), server: ${VEX_ONLINE_URL:-asks on first start}"
          gradle -p android :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace 2>&1 | tee android-build.log

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ secrets.VEX_KEYSTORE_B64 != '' }}
        run: |
          set -e
          cp android/app/build/outputs/apk/release/app-release.apk vex-android.apk
          cp android/app/build/outputs/bundle/release/app-release.aab vex-android.aab
          (cd android/store && zip -qr ../../vex-play-store-kit.zip .)
          sha256sum vex-android.apk vex-android.aab > ANDROID-SHA256SUMS.txt
          if [ "$SIGNED" = "true" ]; then NOTE="Signed with the VEX upload key: vex-android.aab is ready for Google Play."; else NOTE="Not signed for Google Play yet (VEX → Admin → Phone app → Set up Play Store signing). vex-android.apk can still be installed directly."; fi
          gh release view android >/dev/null 2>&1 || gh release create android --prerelease --latest=false --title "VEX for Android" --notes "VEX for Android"
          gh release upload android vex-android.apk vex-android.aab vex-play-store-kit.zip ANDROID-SHA256SUMS.txt --clobber
          gh release edit android --notes "Built from ${GITHUB_SHA::7} on $(date -u +%F). $NOTE"

      - name: Save the build log where it can be read (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (echo '```'; grep -E 'error|FAILED|What went wrong|Could not|e: ' -A4 android-build.log 2>/dev/null | head -c 30000 || tail -c 30000 android-build.log; echo '```') > ci-log.md
          gh release view android-ci-log >/dev/null 2>&1 || gh release create android-ci-log --prerelease --latest=false --title "Android build log" --notes "log"
          gh release edit android-ci-log --notes-file ci-log.md
