# Builds the Vex Client Fabric mod (in-game settings, HUD, zoom) and the Vex UI resource pack,
# and publishes both on the "vex-mod" pre-release (never marked latest, so launcher updates are unaffected).
name: Mod

on:
  push:
    branches: [main]
    paths: ['mod/**', 'tools/make-ui-pack.py', 'renderer/themes.js', '.github/workflows/mod.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mod
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Pick Loom, Fabric Loader and Fabric API for this Minecraft version
        working-directory: mod
        run: |
          set -e
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          LOOM=$(curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml | grep -oP '(?<=<version>)[0-9.]+(?=</version>)' | sort -V | tail -1)
          LOADER=$(curl -fsSL https://meta.fabricmc.net/v2/versions/loader | python3 -c "import json,sys; print(next(v['version'] for v in json.load(sys.stdin) if v.get('stable')))")
          API=$(curl -fsSL "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%22$MC%22%5D&loaders=%5B%22fabric%22%5D" | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['version_number'])")
          echo "Minecraft $MC  Loom $LOOM  Loader $LOADER  Fabric API $API"
          sed -i "s/^loom_version=.*/loom_version=$LOOM/; s/^loader_version=.*/loader_version=$LOADER/; s/^fabric_version=.*/fabric_version=$API/" gradle.properties

      - name: Build mod
        working-directory: mod
        run: gradle build --no-daemon --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Build UI resource pack
        run: python3 -m pip install --quiet pillow && python3 tools/make-ui-pack.py ui-packs && (cd ui-packs && zip -q ../vex-ui-packs.zip *.zip)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp mod/build/libs/vex-client-mod-*[0-9].jar vex-client-mod.jar
          cp ui-packs/vex.zip vex-ui-pack.zip
          sha256sum vex-client-mod.jar vex-ui-pack.zip vex-ui-packs.zip > SHA256SUMS.txt
          gh release view vex-mod >/dev/null 2>&1 || gh release create vex-mod --prerelease --latest=false --title "Vex Client mod + UI pack" --notes "In-game settings mod for Fabric 1.21.11 (needs Fabric API) and the Vex UI resource pack. The launcher installs these automatically."
          gh release upload vex-mod vex-client-mod.jar vex-ui-pack.zip vex-ui-packs.zip SHA256SUMS.txt --clobber
          gh release edit vex-mod --notes "Built from ${GITHUB_SHA::7} on $(date -u +%F). In-game settings mod for Fabric 1.21.11 (needs Fabric API) and the Vex UI resource pack. The launcher installs these automatically."

      - name: Start the game and screenshot every Vex screen
        working-directory: mod
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX" gradle runClientGameTest --no-daemon --stacktrace 2>&1 | tee gametest.log; exit ${PIPESTATUS[0]}

      - name: Upload screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shots=$(find mod -path '*screenshots*' -name '*.png' | sort)
          [ -n "$shots" ] || exit 0
          mkdir -p shots && cp $shots shots/ && (cd shots && zip -q ../mod-screenshots.zip *.png)
          gh release upload vex-mod mod-screenshots.zip --clobber

      - name: Save the build log where it can be read (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (echo '```'; tail -c 30000 mod/build.log 2>/dev/null || echo 'no build log'; echo '--- game test ---'; grep -vE '^\s+at ' mod/gametest.log 2>/dev/null | tail -c 28000; echo '```') > ci-log.md
          gh release view mod-ci-log >/dev/null 2>&1 || gh release create mod-ci-log --prerelease --latest=false --title "Mod build log" --notes "log"
          gh release edit mod-ci-log --notes-file ci-log.md
