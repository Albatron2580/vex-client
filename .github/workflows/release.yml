# Builds the VEX CLIENT installer and publishes it as a GitHub release. Two ways to start it:
#   - push a version tag that matches launcher/package.json, e.g.  git tag v2.0.1 && git push --tags
#   - Actions → Release → Run workflow (uses the version already in launcher/package.json)
# Every installed VEX CLIENT checks the latest release, downloads VEX-CLIENT-Setup-x.y.z.exe,
# verifies it against the .sha256 file, then asks the player to restart.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          if ("${{ github.ref_type }}" -eq "tag" -and "v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match launcher/package.json version $v" }
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release v$v already exists. Bump the version in launcher/package.json first." }
          "version=$v" >> $env:GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - run: npm ci
      - run: npm test

      - name: Make sure NSIS is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe") -and -not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }

      - name: Build the installer
        run: npm run dist

      - name: Checksum
        shell: pwsh
        run: |
          $exe = Get-Item "release/VEX-CLIENT-Setup-${{ steps.ver.outputs.version }}.exe"
          (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $exe.Name | Out-File -Encoding ascii -NoNewline "$($exe.FullName).sha256"
          Get-Content "$($exe.FullName).sha256"

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $exe = "release/VEX-CLIENT-Setup-$v.exe"
          $notes = "VEX CLIENT $v. Installed copies update themselves - this file is only needed for a first install."
          gh release create "v$v" $exe "$exe.sha256" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "VEX CLIENT $v" --notes "$notes" --latest
